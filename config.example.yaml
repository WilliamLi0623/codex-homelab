controller:
  listen: 127.0.0.1:8080
mcp_gateway:
  listen: 127.0.0.1:8090
  database: /var/lib/codex-controller/controller.sqlite
  token_env: MCP_GATEWAY_TOKEN
execution:
  default_class: dedicated-lxc
  warm_ready: 1
  max_nodes: 8
  idle_ttl: 15m
proxmox:
  api_url: https://PROXMOX_HOST:8006/api2/json
  pool: codex-workers
  runtime_identity: codex-homelab-runtime
  dynamic_vmid_range: 3000-3999
  system_storage: local
  data_storage: pool
  bridge: vmbr0
resources:
  small: { cpu: 2, memory: 4Gi, disk: 20Gi }
  medium: { cpu: 4, memory: 8Gi, disk: 40Gi }
  large: { cpu: 8, memory: 16Gi, disk: 80Gi }
models:
  openai_primary: { provider: openai, enabled: true }
  muse_failover: { gateway: cch, model_id: muse-spark-1.3-contributor, reasoning_effort: xhigh, enabled: false }
  # GLM-5.3 Flash uses the validated Chat Completions tool-loop bridge.
  glm_flash_worker: { gateway: cch, model_id: glm-5.3-flash, wire_api: chat-completions, reasoning_effort: max, enabled: false }
secrets:
  cch_api_key_host: CCH_KEY_HOST
  cch_api_key_source: CCH_KEY_SOURCE
  cch_dashboard_url: CCH_DASHBOARD_URL
  kubernetes_secret: codex-model-gateway
